# main에 푸시하면 단위 테스트와 진짜 설치 검증(윈도우·맥)을 거쳐 다음 버전(v1.2.0 → v1.2.1)을 자동으로 공개한다.
# 하나라도 실패하면 Release를 만들지 않는다. 커밋 메시지에 [skip ci]를 넣으면 이번 푸시는 건너뛴다.
name: Release

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

# 검증 중에 또 푸시하면 가장 새 커밋만 공개한다
concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install --only-binary=:all: -r requirements-dev.txt -r requirements-mac.txt
      - run: python -m pytest tests/unit -q
        env:
          QT_QPA_PLATFORM: offscreen

  windows:
    uses: ./.github/workflows/installer.yml

  mac:
    uses: ./.github/workflows/installer-mac.yml

  release:
    needs: [unit-tests, windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: LumiSetup*
          merge-multiple: true
          path: dist
      - name: 다음 버전으로 공개
        run: |
          latest=$(gh release view --json tagName -q .tagName)
          version=${latest#v}
          next="v${version%.*}.$(( ${version##*.} + 1 ))"
          gh release create "$next" dist/LumiSetup.exe dist/LumiSetup-mac-arm64.dmg dist/LumiSetup-mac-intel.dmg \
            --target "$GITHUB_SHA" --title "루미 설치 프로그램 $next" --generate-notes
