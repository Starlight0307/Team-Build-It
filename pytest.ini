[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 기본 실행(pytest / pytest tests/)은 slow/llm 마커가 붙은 테스트를 제외한다 —
# 그래야 unit/integration 스위트가 항상 1~2초 안에 끝나는 빠른 회귀 방어선으로
# 남는다. smoke(실제 OS/라이브러리에 닿는, mock 없는 테스트)는 몇 초~수십 초
# 걸릴 수 있어 slow로, 실제 Ollama 추론이 필요한 테스트(tests/llm_smoke/)는
# llm으로 표시해뒀다. 명시적으로 돌리려면 아래 마커 안내 참고.
# (2026-09-22: 이전엔 여기 "not slow"만 있고 llm은 마커 설명 주석에만 "기본
# 실행에서 제외"라고 적혀 있었다 — llm 마커를 쓰는 테스트가 이때까지 하나도
# 없어서 실제로는 한 번도 걸러진 적 없던 잠재 버그였다. tests/llm_smoke/에
# 처음으로 llm 마커 테스트를 추가하면서 기본 `pytest` 실행에 그대로 딸려
# 들어가는 걸 확인해서 여기서 같이 고친다.)
addopts = -m "not slow and not llm"

markers =
    llm: 실제 Ollama/llama3.1 추론이 필요한 테스트 — 느리고 비결정적이라 기본 실행에서 제외
        (돌리려면: pytest -m llm)
    slow: 실제 OS/라이브러리(psutil, subprocess, kasa 등)에 mock 없이 닿는
        smoke 테스트 — 기본 실행에서 제외됨 (돌리려면: pytest -m slow)
